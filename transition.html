<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>

<style>
    button{ 
        transition-duration: 2s;
        transition-property: background-color,border-radius;
        border-radius: 10%;
        background-color: cadetblue;}

        button:hover{ background-color: aquamarine;
        border-radius: 50%;}

        .card {
  width: 150px;
  height: 100px;
  background-color: #3498db;
  color: white;
  text-align: center;
  line-height: 100px;
  border-radius: 8px;
  margin-top: 50px;
  margin-left: 50px;
  
  /* Smooth animation ke liye transition zaroori hai */
  transition: transform 0.4s ease, background-color 0.4s ease;
}

/* Jab mouse card ke upar aaye */
.card:hover {
  background-color: #2ecc71;
  
  /* Card thoda bada hoga aur 5 degree ghoomega */
  transform: scale(1.1) rotate(5deg) translateY(-5px);
}
.container{ display: flex;
margin-top: 100px;
align-items: center;
justify-content: center;
flex-wrap: wrap;}

.imge img{ height: 150px;
width: 150px;
border-radius: 10px;
margin-right: 50px;
margin-left: 50px;
transition: transform;
transition-duration: 2s;}

.imge img:hover{ transform: skewx(20deg);}

.img1 img{ height: 150px;
width: 150px;
border-radius: 10px;
margin-right: 50px;
margin-left: 50px;
transition: transform;
transition-duration: 2s;}

.img1 img:hover{ transform: scale(1.5);}

.img2 img{ height: 150px;
width: 150px;
border-radius: 10px;
margin-left: 50px;
margin-right: 50px;
transition: transform;
transition-duration: 1s;}

.img2 img:hover{ transform: rotate(10deg) scale(1.5) translateY(-10px);}

.img3 img{ height: 150px;
width: 150px;
border-radius: 10px;
margin-left: 50px;
margin-right: 50px;
transition: transform;
transition-duration: 2s;}

.img3 img:hover{ transform: translateY(50px);}
</style>
</head>
<body>
    <button>
        Hi Arslan 
    </button>


    <div class="card">Hover Me!</div>

<div class="container">
    <div class="imge"><img src="image.jfif" alt=""></div>
    <div class="img1"> <img src="image1.jfif" alt=""></div>
    <div class="img2"><img src="image2.jfif" alt=""></div>
        <div class="img3"><img src="image1.jfif" alt=""></div>
    
</div>



</body>
</html>
