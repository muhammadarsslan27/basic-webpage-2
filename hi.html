<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{ margin: 0;
        padding: 0;
    background-color: rgb(226, 203, 172);}
    #container { height: 100px; 
    width: 100%; 
 background-color: rgb(223, 182, 133);
  display: flex; }

  #container h1{ margin-top: auto; margin-left: 5%;}


 #container ul{ 
 display: flex; list-style-type: none; 
     gap: 20px; align-items: end; 
      margin-left: auto; 
     margin-right: 10px;
    
}

#container ul li a{
     
     text-decoration: none;
     text-align: right;
          color: black;

 }

 /* #container ul li:hover{
     background-color: bisque ; 
    color: black; border-radius: 5px;
    
} */

 #container ul li a::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 2px;            /* Line ki motai */
  bottom: 0;
  left: 0;
  background-color: #000;
  position: relative;
display: inline-block; /* Line ka color */ 
  
  transform: scaleX(0);
  transform-origin: bottom left; 
  transition: transform 0.3s ease-in-out;
}

#container ul a:hover::after {
  /* Hover par line left se right phailti hai */
  transform: scaleX(1);
}
    </style>
</head>
<body>
    <div id="container"> 
 <h1> <i>Logo</i></h1>
 <ul>
 <li><a href="#home">Home</a></li>
 <li><a href="#about">About</a></li>
 <li><a href="#contact">Contact</a></li></ul>
    </div>
</body>
</html>
